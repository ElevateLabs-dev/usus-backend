[project]
name = "usus-backend"
version = "0.1.0"
description = "Usus: AI-Powered Simulation Environment Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",                 # For asynchronously saving voice recordings to S3
    "alembic>=1.18.4",
    "anthropic>=0.84.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.2",
    "fastapi[standard]>=0.133.1",       # Comes with uvicorn
    "itsdangerous>=2.2.0",              # For secure token generation# Required by starlette-admin for session security
    "openai>=2.24.0",
    "pgvector>=0.4.2",                  # For RAG embeddings in PostgreSQL
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",         # Required for file/audio uploads
    "redis>=7.2.1",
    "sqlalchemy[asyncio]>=2.0.47",
    "starlette-admin>=0.16.0",
    "tiktoken>=0.12.0",
    "websockets>=16.0",                 # For real-time WebRTC signaling & Sockets
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # pytest-asyncio: treat all async test functions as asyncio tests
testpaths = ["tests"]

[tool.ruff]
# Standard Ruff configuration for FastAPI projects
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle, pyflakes, isort
