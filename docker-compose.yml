services:
  # PostgreSQL Database with pgvector extension for RAG
  db:
    image: pgvector/pgvector:pg16
    container_name: usus_postgres
    restart: always
    environment:
      POSTGRES_USER: usus_admin
      POSTGRES_PASSWORD: usus_local_password
      POSTGRES_DB: usus_dev_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usus_admin -d usus_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery Task Queue and potentially WebSockets/Caching
  redis:
    image: redis:7-alpine
    container_name: usus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: usus_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 5 && ollama pull llama3.1:8b && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: usus_postgres_data
  redis_data:
    name: usus_redis_data
  ollama_data:
    name: usus_ollama_data
